<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Bean & Brew Cafe</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header>
    <div class="logo">☕ Bean & Brew</div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="reservation.html">Reservation</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <button id="darkBtn">🌙</button>
</header>

<section class="contact-hero">
    <h1>Contact Us</h1>
    <p>We would love to hear from you.</p>
</section>

<section class="contact-container">

    <div class="contact-info">

        <h2>Get In Touch</h2>

        <p><strong>📍 Address:</strong> 123 Coffee Street, Mumbai</p>

        <p><strong>📞 Phone:</strong> +91 98765 43210</p>

        <p><strong>📧 Email:</strong> info@beanbrewcafe.com</p>

        <p><strong>🕒 Opening Hours:</strong> 8:00 AM - 11:00 PM</p>

    </div>

    <div class="contact-form">

        <form id="contactForm">

            <input type="text" id="name" placeholder="Your Name" required>

            <input type="email" id="email" placeholder="Your Email" required>

            <input type="text" id="subject" placeholder="Subject" required>

            <textarea id="message" rows="5" placeholder="Your Message" required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</section>

<section class="map-section">

    <h2>Find Us</h2>

    <iframe
    src="https://maps.google.com/maps?q=mumbai&t=&z=13&ie=UTF8&iwloc=&output=embed"
    width="100%"
    height="400"
    style="border:0;"
    allowfullscreen=""
    loading="lazy">
    </iframe>

</section>

<footer>
    <p>© 2026 Bean & Brew Cafe</p>
</footer>

<script src="js/script.js"></script>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){

e.preventDefault();

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;

if(name === "" || email === ""){
    alert("Please fill all fields.");
}
else{
    alert("Message sent successfully!");
    this.reset();
}

});
</script>

</body>
</html>
